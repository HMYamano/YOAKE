# モード③: 物体検出＋ID トラッキング
# 段: 学習済み統合モデル (fused) が検出+dense+track_id を1passで供給。
# L1b は推奨 ON (安定化済み検出で偽トラック/ID切替を減らす)。
pipeline:
  mode: strict
  window_size: 16           # fused は内部で sliding window 推論に使う
  stride: 8
  inputs: [image]
  device: auto
  layers:
    L1_detection:
      enabled: true
      backend: fused_htrtdetr   # boxes/class/score/dense/track_id を一括供給
      params:
        checkpoint: weights/stage4_best.pth

    L1b_stabilization:
      enabled: true
      backend: temporal_nms
      params: { iou_link: 0.5, min_persist: 2, max_gap: 1, score_smooth: ema }
