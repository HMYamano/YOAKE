name: tests

on:
  push:
  pull_request:

jobs:
  # Windows is the primary environment for YOAKE (the annotator and the SAM
  # sidecar are developed and used there), so it is tested as a first-class
  # target rather than assumed to work from the Linux result.
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile every source and test file
        run: python -m compileall -q src tests

      # The GUI tests open a dearpygui window, so they are deselected here.
      # Everything they cover that can run headless lives in the pure modules
      # (gui/video_source, gui/labeling_ops, gui/commands, ...) and does run.
      - name: Run tests
        run: pytest -q -m "not gui"

  # Lint and type-check are advisory-scoped on purpose: the repository has a
  # long tail of pre-existing findings, and turning the whole tree strict in one
  # go would leave CI permanently red and therefore ignored. The rule set and
  # the checked paths widen over time; what is listed here must stay clean.
  lint:
    name: ruff + mypy (advisory scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      # Whole tree (src and tests), with the rule set configured in
      # pyproject.toml [tool.ruff.lint]. That set is narrow on purpose and is
      # green today, so any failure here is a new problem, not a backlog item.
      - name: ruff check
        run: ruff check src tests

      # A growing allowlist rather than the whole tree: .mypy-clean.txt names
      # the modules that type-check cleanly, and gains entries as modules are
      # annotated. --follow-imports=silent keeps the check to those files
      # instead of dragging in every transitive import.
      - name: mypy (modules kept type-clean)
        run: |
          mypy --ignore-missing-imports --follow-imports=silent \
            $(grep -v '^\s*#' .mypy-clean.txt | grep -v '^\s*$' | tr '\n' ' ')
