[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htrtdetr"
version = "0.1.0"
description = "YOAKE: Hierarchical Temporal RT-DETR for Animal Behavior Analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["computer-vision", "object-detection", "multi-object-tracking", "action-recognition", "animal-behavior"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scipy>=1.10.0",
]

[project.scripts]
yoake = "htrtdetr.cli:main"
annotate = "htrtdetr.annotator:main"
gui = "htrtdetr.gui:main"

[project.optional-dependencies]
annotate = ["opencv-python>=4.8.0", "dearpygui>=1.11.0"]
gui = ["opencv-python>=4.8.0", "dearpygui>=1.11.0"]
# Video propagation in the annotator: one prompt carried across a window.
# Install into the Python that runs the segmentation helper (tools/sam_sidecar.py),
# which is not necessarily the one running the GUI.
#
# huggingface_hub is listed because sam2 does NOT depend on it and cannot reach
# a checkpoint without it: SAM2VideoPredictor.from_pretrained imports it inside
# build_sam._hf_download. `pip install sam2` alone installs a package that
# raises ModuleNotFoundError on every load.
sam2 = ["sam2>=1.1.0", "huggingface_hub>=0.23.0"]
# "Find all in frame" in the annotator: type what the animal is and get a box
# per animal, with no trained model and no per-animal clicking. Install into the
# same Python as sam2 above.
#
# This is the one thing SAM cannot do. SAM and SAM 2 are promptable - they
# answer "what is at this point" - so on their own they can refine a box but
# never find one. An open-vocabulary detector (OWLv2, via transformers) does the
# finding, and the SAM adapter beside it turns each box into the oriented box
# YOAKE stores. Without this the op is reported as unavailable and clicking or
# Continue still work.
#
# No huggingface_hub entry: transformers depends on it already, so there is no
# half-installed trap here of the kind sam2 has.
concept = ["transformers>=4.40.0"]
vis = ["matplotlib>=3.7.0", "opencv-python>=4.8.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black", "isort", "mypy"]
wandb = ["wandb>=0.16.0"]
all = ["matplotlib>=3.7.0", "opencv-python>=4.8.0", "wandb>=0.16.0", "transformers>=4.40.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "gui: opens a dearpygui window; deselect with -m 'not gui'",
    "live_model: loads a real model checkpoint (downloads on first run); deselect with -m 'not live_model'",
]
